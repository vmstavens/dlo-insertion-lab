[project]
name = "drl-sys-lab"
version = "0.1.0"
description = "A systems lab for scalable MuJoCo reinforcement-learning infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4,<1.4",
    "jax>=0.10.2",
    "jaxlie>=1.5.0",
    "mjsim",
    "mjxsim",
    "mujoco>=3.10.0",
    "mujoco-mjx>=3.10.0",
    "numpy>=1.26",
    "playground>=0.2.0",
]

[tool.uv.sources]
mjsim = { git = "https://github.com/vmstavens/mjsim.git" }
mjxsim = { git = "https://github.com/vmstavens/mjxsim.git" }

[project.optional-dependencies]
monitoring = ["tensorboard>=2.18,<3"]
publication = ["matplotlib>=3.8,<4", "scipy>=1.15,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
